name: gharkakhana_mobile
description: "GharKaKhana Mobile - Fresh Home Food"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  provider: ^6.1.2
  shared_preferences: ^2.5.2
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  permission_handler: ^11.3.1
  app_settings: ^5.1.1
  open_filex: ^4.5.0
  path_provider: ^2.1.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_foreground: "assets/branding/adaptive_foreground.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_monochrome: "assets/branding/monochrome.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#F57C00"
  windows:
    generate: true
    image_path: "assets/branding/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/branding/app_icon.png"
  linux:
    generate: true
    image_path: "assets/branding/app_icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/branding/logo.png"
  android: true
  ios: true
  web: true
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#FFFFFF"
    image: "assets/branding/logo.png"
    icon_background_color: "#FFFFFF"
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/branding/
